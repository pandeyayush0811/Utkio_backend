<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utkio — Checkout</title>
<style>
  :root{ --bg:#f7f6fb; --card:#ffffff; --ink:#1c1c28; --ink-dim:#6b6b7d; --accent:#6a63f1; --err:#e0455a; --ok:#1ea672; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--card); border-radius:20px; padding:32px 26px; max-width:400px; width:100%; box-shadow:0 20px 50px -20px rgba(60,60,120,0.25); text-align:center; }
  .logo{ font-weight:800; font-size:1.3rem; letter-spacing:-0.3px; margin-bottom:4px; }
  .plan-name{ font-size:1.05rem; font-weight:700; margin-top:18px; }
  .amount{ font-size:2rem; font-weight:800; margin-top:6px; }
  .sub{ font-size:0.85rem; color:var(--ink-dim); margin-top:6px; }
  button{ margin-top:26px; width:100%; padding:14px; border:none; border-radius:14px; background:var(--accent); color:#fff; font-size:1rem; font-weight:700; cursor:pointer; }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  .msg{ margin-top:16px; font-size:0.88rem; min-height:20px; }
  .msg.err{ color:var(--err); }
  .msg.ok{ color:var(--ok); }
  .spinner{ width:34px; height:34px; border:3px solid #e5e3f5; border-top-color:var(--accent); border-radius:50%; margin:20px auto; animation:spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .success-icon{ width:56px; height:56px; margin:8px auto 0; color:var(--ok); }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">Utkio</div>
  <div class="spinner"></div>
  <div class="sub" id="statusText">Loading your order...</div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
(function () {
  const cardEl = document.getElementById('card');
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  function renderError(text) {
    cardEl.innerHTML =
      '<div class="logo">Utkio</div>' +
      '<div class="msg err" style="margin-top:16px;">' + text + '</div>' +
      '<div class="sub" style="margin-top:10px;">App par wapas jaakar dobara try karo.</div>';
  }

  function renderSuccess(planLabel) {
    cardEl.innerHTML =
      '<div class="logo">Utkio</div>' +
      '<svg class="success-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>' +
      '<div class="plan-name" style="margin-top:14px;">Payment successful!</div>' +
      '<div class="sub">' + planLabel + ' plan is now active.</div>' +
      '<div class="sub" style="margin-top:18px;">Ab is tab ko band karke Utkio app par wapas jao.</div>';
  }

  function renderOrder(order) {
    const rupees = (order.amount / 100).toLocaleString('en-IN');
    const planLabel = order.plan.charAt(0).toUpperCase() + order.plan.slice(1);
    cardEl.innerHTML =
      '<div class="logo">Utkio</div>' +
      '<div class="plan-name">Uktio ' + planLabel + '</div>' +
      '<div class="amount">\u20B9' + rupees + '</div>' +
      '<div class="sub">30 din ke liye</div>' +
      '<button id="payBtn">Pay \u20B9' + rupees + '</button>' +
      '<div class="msg" id="msg"></div>';

    document.getElementById('payBtn').addEventListener('click', function () {
      startPayment(order, planLabel);
    });
  }

  function startPayment(order, planLabel) {
    if (typeof Razorpay === 'undefined') {
      const msg = document.getElementById('msg');
      msg.textContent = 'Payment SDK load nahi ho paya — internet check karke page reload karo.';
      msg.className = 'msg err';
      return;
    }
    const payBtn = document.getElementById('payBtn');
    const msg = document.getElementById('msg');
    payBtn.disabled = true;
    msg.textContent = '';
    msg.className = 'msg';

    const rzp = new Razorpay({
      key: order.key_id,
      amount: order.amount,
      currency: order.currency,
      order_id: order.order_id,
      name: 'Uktio',
      description: 'Uktio ' + planLabel + ' \u2014 30 din',
      theme: { color: '#6a63f1' },
      handler: async function (response) {
        msg.textContent = 'Verifying payment...';
        try {
          const res = await fetch('/payments/checkout/' + encodeURIComponent(token) + '/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(response)
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || 'Verification failed');
          renderSuccess(planLabel);
        } catch (e) {
          // Payment DID succeed with Razorpay — the webhook (server-to-
          // server, independent of this tab) still activates the plan
          // shortly even if this verify call itself failed. Don't scare
          // the user into re-paying.
          msg.textContent = 'Payment ho gaya! Plan activate hone mein thoda time lag sakta hai. App par wapas jaakar thodi der mein check karo.';
          msg.className = 'msg ok';
          payBtn.style.display = 'none';
        }
      },
      modal: {
        ondismiss: function () {
          payBtn.disabled = false;
        }
      }
    });

    rzp.on('payment.failed', function (resp) {
      msg.textContent = 'Payment fail ho gaya: ' + (resp.error && resp.error.description ? resp.error.description : 'try again');
      msg.className = 'msg err';
      payBtn.disabled = false;
    });

    rzp.open();
  }

  async function init() {
    if (!token) {
      renderError('Invalid checkout link.');
      return;
    }
    try {
      const res = await fetch('/payments/checkout/' + encodeURIComponent(token));
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        renderError(data.error || 'This checkout link is no longer valid.');
        return;
      }
      renderOrder(data);
    } catch (e) {
      renderError('Server se connect nahi ho pa raha. Internet check karo aur reload karo.');
    }
  }

  init();
})();
</script>
</body>
</html>
